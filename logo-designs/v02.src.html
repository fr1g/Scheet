<div class="grid h-screen w-full items-center justify-center ">
    <div class="p-1 shadow border bg-red-500">
        <div
            class="relative flex size-64 flex-col overflow-hidden rounded-[60px] rounded-tr-xl rounded-bl-xl bg-zinc-800 border-white border-2 box-border">
            <div
                class="absolute top-0 right-0 bottom-auto left-0 z-1 hidden h-12 w-full rounded-b-xs rounded-br-[64px] bg-zinc-500">
            </div>
            <div class="h-full w-full grow p-3">
                <div
                    class="flex h-full w-full gap-0 overflow-hidden rounded-[0.56rem] rounded-tl-[50px] box-content0 rounded-br-[50px] border-2 border-white">
                    <!-- <div class="relative grow border-white"></div> -->
                    <div class="relative grow border-l-2- border-white">
                        <div class="absolute -top-3 right-0.5 left-0.5 space-y-0.5 px-0.5">
                            <div class="cell / h-9.5"></div>
                            <div class="cell cell-rest / h-5"></div>
                            <div class="cell / h-4.5"></div>
                            <div class="cell / h-17.5 bg-[#615ea8]!"></div>
                        </div>
                    </div>
                    <div class="relative grow border-l-2 border-white">
                        <div class="absolute top-auto bottom-auto left-px right-px  h-full  grid items-center p-1">
                            <div
                                class="rounded-lg w-full  top-auto bottom-auto  / grid h-50  items-center justify-center bg-[#fecac0de]!">
                                <div style="writing-mode: vertical-rl; text-orientation: sideways-right"
                                    class=" --translate-x-px scale-y-128 font-serif text-3xl font-bold">SCHEET</div>
                            </div>
                        </div>
                    </div>
                    <div class="relative grow border-l-2 border-white">
                        <div class="absolute -bottom-3 right-0.5 left-0.5 space-y-0.5 px-0.5">
                            <div class="cell / h-3"></div>
                            <div class="cell cell-rest / h-5"></div>
                            <div class="cell / h-10 bg-emerald-300!"></div>
                            <div class="cell / h-5.5"></div>
                            <div class="cell / h-8"></div>

                            <div class="cell cell-rest / h-4"></div>
                        </div>
                    </div>
                    <!-- <div class="relative grow border-l-2 border-white"></div> -->
                </div>
            </div>
        </div>
    </div>
</div>
