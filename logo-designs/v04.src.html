<div class="grid h-screen w-full items-center justify-center">
    <div class="bg-red-500 scale-360 border p-1 shadow">
        <div
            class="relative flex size-64  flex-col overflow-hidden rounded-[88px] rounded-tr-2xl rounded-bl-2xl border-4 border-zinc-50 bg-zinc-800">
            <div class="flex h-full w-full grow overflow-hidden">
                <div class="relative grow">
                    <div class="absolute -top-0 right-0.5 left-0.5 space-y-0.5 px-0.5">
                        <div class="cell / h-9.5"></div>
                        <div class="cell cell-rest / h-5"></div>
                        <div class="cell / h-4.5"></div>
                        <div class="cell / h-13"></div>
                        <div class="cell cell-rest / h-3.5"></div>
                    </div>
                </div>
                <!-- bg-[#615ea8e0]! #fecac0de #62748e -->
                <div class="border-x-4- relative w-39 border-zinc-50">
                    <div class="absolute top-auto right-px bottom-auto left-px grid h-full items-center p-3">
                        <div
                            class="/ bg-zinc-500. relative top-auto bottom-auto grid h-50 w-full items-center justify-center rounded-lg">
                            <div
                                class="bg-[#fecac0de]  scale-120 absolute z-10 h-[75px] w-13 rounded-lg border-8 border-zinc-50 border-r-4 border-r-transparent rotate-36 top-[11.79%] right-6">
                            </div>
                            <div
                                class="relative z-20 size-[9px] -translate-y-[96.5%] -translate-x-[144%] bg-zinc-50 rotate-36 ">

                            </div>
                            <div
                                class="bg-[#615ea8e0]  scale-120 absolute z-12 h-[75px] w-13 rounded-lg border-8 border-zinc-50 border-l-4 border-l-transparent rotate-36 bottom-[11.79%] left-6">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="relative grow">
                    <div class="absolute right-0.5 -bottom-0 left-0.5 space-y-0.5 px-0.5">
                        <div class="cell / h-3"></div>
                        <div class="cell cell-rest / h-5"></div>
                        <div class="cell / h-10"></div>
                        <div class="cell / h-5.5"></div>
                        <div class="cell / h-8"></div>
                        <div class="cell cell-rest / h-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
