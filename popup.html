<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>Scheet 提醒</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
      html, body { height: 100%; overflow: hidden; background: #1c1c1f; }
      body {
        border: 1px solid #52525b;
        color: #f4f4f5;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        padding: 12px;
      }
      .meta { display: flex; justify-content: space-between; color: #a1a1aa; font-size: 10px; }
      .clock { font-family: Consolas, monospace; color: #e4e4e7; font-size: 12px; }
      .title { margin-top: 4px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub { color: #d4d4d8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; color: #71717a; font-size: 10px; }
      .open-main {
        pointer-events: auto;
        border: 1px solid #71717a; border-radius: 4px; background: transparent;
        color: #f4f4f5; font-size: 10px; padding: 2px 8px; cursor: pointer;
      }
      .open-main:hover { background: #3f3f46; }
    </style>
  </head>
  <body>
    <div class="meta">
      <span id="mode-label"></span>
      <span class="clock" id="clock"></span>
    </div>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
    <div class="foot">
      <span id="click-hint"></span>
      <button class="open-main" id="open-main"></button>
    </div>
    <script type="module" src="/src/popup-page/main.ts"></script>
  </body>
</html>
